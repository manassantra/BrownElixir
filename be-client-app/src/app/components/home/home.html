<div class="container py-3">

    <div class="mb-3">
        <img src="https://www.shutterstock.com/image-photo/red-wine-chocolate-truffles-on-600nw-2401987177.jpg" class="img-fluid rounded" alt="Banner">
    </div>

    <div class="d-flex justify-content-start align-items-start mb-4" routerLink="product-list/All">
        <h6 class="mb-0">All Variants</h6>
        <a class="small all"><i class="bi bi-arrow-right-circle-fill text-dark"></i></a>
    </div>

    <div class="all-variants mb-3">
        <div class="variant-item" *ngFor="let item of productCategories" (click)="goToThisVariant(item.categoryName)">
            <img src={{item.imgUrl}} class="variant-img" alt={{item.categoryName}}>
            <div class="variant-label">{{item.categoryName}}</div>
        </div>
    </div>

    <div class="d-flex justify-content-start align-items-start mb-4" routerLink="product-list/All">
        <h6 class="mb-0">All Products</h6>
        <a class="small all"><i class="bi bi-arrow-right-circle-fill text-dark"></i></a>
    </div>

    <div class="row">
        <div class="col-6 col-md-4 col-lg-3 mb-3">
            <div class="product-card">
                <img src="https://cdn11.bigcommerce.com/s-mg465bi/images/stencil/original/uploaded_images/chocolatewinepairing.jpg?t=1517943176"
                    class="product-img mb-2" alt="Product">
                <div>Product Name</div>
                <div class="text-muted small">Rs. 450.00</div>
                <div class="product-actions">
                    <i class="bi bi-heart fs-2"></i>
                    <i class="bi bi-cart fs-2"></i>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-3">
            <div class="product-card">
                <img src="https://cdn11.bigcommerce.com/s-mg465bi/images/stencil/original/uploaded_images/chocolatewinepairing.jpg?t=1517943176"
                    class="product-img mb-2" alt="Product">
                <div>Product Name</div>
                <div class="text-muted small">Rs. 450.00</div>
                <div class="product-actions">
                    <i class="bi bi-heart fs-2"></i>
                    <i class="bi bi-cart fs-2"></i>
                </div>
            </div>
        </div>
    </div>
<br><br>
</div>
