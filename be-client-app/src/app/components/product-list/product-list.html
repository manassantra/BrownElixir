<div class="container py-3" style="max-width: 720px;">

    <!-- 🔍 Search Box -->
    <div class="d-flex justify-content-center mb-3">
        <input type="text" [(ngModel)]="search" (input)="applyFilters()"
            class="form-control w-md-50 border border-dark rounded-pill px-3" placeholder="Search Product Name / Product Id / Flavor">
    </div>

    <!-- 🔗 Filter & Sort Controls -->
    <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">

        <div class="dropdown border border-dark rounded border-2">
            <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="flavorDropdown"
                data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-sliders"></i>
                {{ flavor || 'Sort by Flavor' }}
            </button>
            <ul class="dropdown-menu" aria-labelledby="flavorDropdown">
                <li (click)="selectFlavor('')">
                    <a class="dropdown-item"><i class="bi bi-three-dots"></i> All</a>
                </li>
                <li (click)="selectFlavor('Dark')">
                    <a class="dropdown-item"><i class="bi bi-moon-fill"></i> Dark</a>
                </li>
                <li (click)="selectFlavor('Mix')">
                    <a class="dropdown-item"><i class="bi bi-layers"></i> Mix</a>
                </li>
                <li (click)="selectFlavor('Milk')">
                    <a class="dropdown-item"><i class="bi bi-cup"></i> Milk</a>
                </li>
                <li (click)="selectFlavor('Wine')">
                    <a class="dropdown-item"><i class="bi bi-cup-straw"></i> Wine</a>
                </li>
            </ul>
        </div>

        <select class="form-select form-select-sm w-auto" [(ngModel)]="sortOrder" (change)="applyFilters()">
            <option value="asc">Low to High</option>
            <option value="desc">High to Low</option>
        </select>

    </div>

    <!-- 🛒 Product Grid -->
    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" *ngFor="let product of products" [ngClass]="{ 'opacity-50 disabled': !product?.inStock }">
            <div class="card h-100 product-card text-center">

                <img [src]="product.imgUrl" alt="Product" class="card-img-top"  [routerLink]="['/product', product?.id]">

                <div class="card-body p-2">
                    <h6 class="product-name mb-1 text-truncate" [routerLink]="['/product', product?.id]">{{ product?.productName }}</h6>

                    <div class="d-flex justify-content-between align-items-center" [routerLink]="['/product', product?.id]">
                        <p class="price mb-1 fw-bold">Rs. {{ product?.unitPrice | number:'1.2-2' }}</p>
                        <p class="quantity text-muted small mb-1">★ 4.2</p>
                    </div>

                    <div class="d-flex justify-content-around" *ngIf="product?.inStock">
                        <button class="btn btn-sm btn-outline-warning">
                            <i class="bi bi-heart"></i>
                        </button>

                        <button class="btn btn-sm btn-outline-dark" (click)="addToCart(product)">
                            <i class="bi bi-cart"></i>
                            <i class="bi bi-plus small-icon"></i>
                        </button>
                    </div>
                    <div class="d-flex justify-content-center" *ngIf="!product?.inStock">
                        <button class="btn btn-sm btn-outline-dark" [ngClass]="{'disabled': !product?.inStock}">
                            Out of Stock
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 🔄 Loading Indicator -->
    <div class="text-center mt-3" *ngIf="loading">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <br><br>
</div>
