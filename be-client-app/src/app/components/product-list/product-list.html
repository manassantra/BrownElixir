<div class="container py-3">

    <!-- 🔍 Search Box -->
    <div class="d-flex justify-content-center col-xs-10 col-md-6 col-lg-6 mb-3">
        <input type="text" [(ngModel)]="search" (input)="applyFilters()"
            class="form-control w-100 w-md-50 border border-dark rounded-pill px-3" placeholder="Search Product / Id / Flavor / Season">
    </div>

    <!-- 🔗 Filter & Sort Controls -->
    <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">

        <div class="dropdown border border-dark rounded border-2">
            <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="flavorDropdown"
                data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-sliders"></i>
                {{ flavor || 'Sort by Flavor' }}
            </button>
            <ul class="dropdown-menu" aria-labelledby="flavorDropdown">
                <li (click)="selectFlavor('')">
                    <a class="dropdown-item"><i class="bi bi-three-dots"></i> All</a>
                </li>
                <li (click)="selectFlavor('Dark')">
                    <a class="dropdown-item"><i class="bi bi-moon-fill"></i> Dark</a>
                </li>
                <li (click)="selectFlavor('Mix')">
                    <a class="dropdown-item"><i class="bi bi-layers"></i> Mix</a>
                </li>
                <li (click)="selectFlavor('Milk')">
                    <a class="dropdown-item"><i class="bi bi-cup"></i> Milk</a>
                </li>
                <li (click)="selectFlavor('Wine')">
                    <a class="dropdown-item"><i class="bi bi-cup-straw"></i> Wine</a>
                </li>
            </ul>
        </div>


        <!-- <select class="form-select form-select-sm w-auto" [(ngModel)]="flavor" (ngModelChange)="applyFilters()">
            <option value="" disabled>-Sort by Flavor-</option>
            <option value="Dark">Dark Chocolate</option>
            <option value="Mix">Mix</option>

            <option value="Wine">Wine</option>
        </select> -->

      <option value="Valentines Day">Valentine's Day</option>
      <option value="Birthday Gift">Birthday Gift</option>
      <option value="Anniversary Gift">Anniversary Gift</option>
      <option value="Date Surprise">Date Surprise</option>
    </select> -->

        <select class="form-select form-select-sm w-auto" [(ngModel)]="sortOrder" (change)="applyFilters()">
            <span><i class="bi bi-tags"></i></span>
            <option value="asc">Low to High</option>
            <option value="desc">High to Low</option>
        </select>

        <!-- <select class="form-select form-select-sm w-auto">
      <option selected disabled>-Ratings-</option>
      <option>Top Rated</option>
      <option>Most Reviewed</option>
    </select> -->

    </div>

    <!-- 🛒 Product Grid -->
    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" *ngFor="let product of products">
            <div class="card h-100 product-card text-center" [routerLink]="['/product', product.id]">

                <img [src]="product.imgUrl" alt="Product" class="card-img-top">

                <div class="card-body p-2">
                    <h6 class="product-name mb-1 text-truncate">{{ product.productName }}</h6>

                    <div class="d-flex justify-content-between align-items-center">
                        <p class="price mb-1 fw-bold">Rs. {{ product.unitPrice | number:'1.2-2' }}</p>
                        <p class="quantity text-muted small mb-1">★ 4.2</p>
                    </div>

                    <div class="d-flex justify-content-around">
                        <div class="icon-box">
                            <i class="bi bi-heart"></i>
                        </div>

                        <div class="icon-box">
                            <i class="bi bi-cart"></i>
                            <i class="bi bi-plus small-icon"></i>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 🔄 Loading Indicator -->
    <div class="text-center mt-3" *ngIf="loading">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <br><br>
</div>
